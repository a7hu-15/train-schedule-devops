apiVersion: apps/v1
kind: Deployment
metadata:
  name: railpulse-api
  namespace: railpulse
  labels:
    app.kubernetes.io/name: railpulse-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: railpulse-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railpulse-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: railpulse/api:v1.0.0
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: railpulse-config
            - secretRef:
                name: railpulse-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
