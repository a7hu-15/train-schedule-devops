apiVersion: apps/v1
kind: Deployment
metadata:
  name: railpulse-web
  namespace: railpulse
  labels:
    app.kubernetes.io/name: railpulse-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: railpulse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railpulse-web
    spec:
      containers:
        - name: web
          image: railpulse/web:v1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
