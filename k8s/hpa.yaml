apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: train-schedule-hpa
  labels:
    app: train-schedule
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: train-schedule-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
